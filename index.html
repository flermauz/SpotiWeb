  <script src="https://scdn.co"></script>
  <script>
    const clientId = '9fd72aaabb6b4c6eab6d093508f7df39';
    const redirectUri = 'https://github.io';
    let token = localStorage.getItem('sp_token');
    let deviceId = '';
    let player;

    async function login() {
      const verifier = Array.from(crypto.getRandomValues(new Uint8Array(32)), b => ('0' + b.toString(16)).slice(-2)).join('');
      localStorage.setItem('verifier', verifier);
      const data = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      const challenge = btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      const scopes = 'streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state';
      
      const authUrl = 'https://spotify.com' +
        '?client_id=' + encodeURIComponent(clientId) +
        '&response_type=code' +
        '&redirect_uri=' + encodeURIComponent(redirectUri) +
        '&scope=' + encodeURIComponent(scopes) +
        '&code_challenge_method=S256' +
        '&code_challenge=' + encodeURIComponent(challenge);

      window.location.href = authUrl;
    }

    async function handleAuth() {
      const code = new URLSearchParams(window.location.search).get('code');
      if (code) {
        const res = await fetch('https://spotify.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: clientId,
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: redirectUri,
            code_verifier: localStorage.getItem('verifier')
          })
        });
        const data = await res.json();
        if (data.access_token) {
          token = data.access_token;
          localStorage.setItem('sp_token', token);
          window.history.replaceState({}, document.title, redirectUri);
        }
      }
      if (token) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
      }
    }

    window.onSpotifyWebPlaybackSDKReady = () => {
      if (!token) return;
      player = new Spotify.Player({
        name: 'Custom Web Player',
        getOAuthToken: cb => cb(token),
        volume: 0.8
      });
      player.addListener('ready', ({ device_id }) => { deviceId = device_id; });
      player.addListener('player_state_changed', state => {
        if (!state) return;
        const track = state.track_window.current_track;
        document.getElementById('track-info').innerText = `${track.name} — ${track.artists.map(a => a.name).join(', ')}`;
      });
      player.connect();
    };

    async function searchSongs() {
      const q = document.getElementById('search-input').value;
      const res = await fetch(`https://spotify.com{encodeURIComponent(q)}&type=track&limit=8`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const box = document.getElementById('results');
      box.innerHTML = '';
      data.tracks.items.forEach(t => {
        const div = document.createElement('div');
        div.className = 'track';
        div.innerHTML = `<span>${t.name} - ${t.artists.map(a => a.name).join(', ')}</span><button onclick="playUri('${t.uri}')">Play</button>`;
        box.appendChild(div);
      });
    }

    async function playUri(uri) {
      await fetch(`https://spotify.com{deviceId}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ uris: [uri] })
      });
    }

    handleAuth();
  </script>
