<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Player</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .box { max-width: 600px; margin: auto; background: #181818; padding: 20px; border-radius: 12px; }
    button { background: #1DB954; color: #000; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; margin: 4px; }
    button:hover { background: #1ed760; }
    input { width: 70%; padding: 10px; border-radius: 20px; border: none; background: #282828; color: #fff; }
    .track { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #282828; }
    .now-playing { background: #282828; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Personal Music Player</h2>
    <div id="login-view">
      <button onclick="login()">Connect Spotify</button>
    </div>

    <div id="player-view" style="display:none;">
      <div class="now-playing">
        <div id="track-info">Ready to play...</div>
        <div style="margin-top:10px;">
          <button onclick="player.previousTrack()">Prev</button>
          <button onclick="player.togglePlay()">Play / Pause</button>
          <button onclick="player.nextTrack()">Next</button>
        </div>
      </div>

      <div>
        <input type="text" id="search-input" placeholder="Search songs..." />
        <button onclick="searchSongs()">Search</button>
      </div>
      <div id="results" style="margin-top:15px;"></div>
    </div>
  </div>

  <script src="https://scdn.co"></script>
  <script>
    const clientId = '9fd72aaabb6b4c6eab6d093508f7df39';
    const redirectUri = window.location.origin + window.location.pathname;
    let token = localStorage.getItem('sp_token');
    let deviceId = '';
    let player;

    async function login() {
      const verifier = Array.from(crypto.getRandomValues(new Uint8Array(32)), b => ('0' + b.toString(16)).slice(-2)).join('');
      localStorage.setItem('verifier', verifier);
      const data = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      const challenge = btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      const scopes = 'streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state';
      window.location = `https://spotify.com{clientId}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${encodeURIComponent(scopes)}&code_challenge_method=S256&code_challenge=${challenge}`;
    }

    async function handleAuth() {
      const code = new URLSearchParams(window.location.search).get('code');
      if (code) {
        const res = await fetch('https://spotify.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: clientId, grant_type: 'authorization_code', code,
            redirect_uri: redirectUri, code_verifier: localStorage.getItem('verifier')
          })
        });
        const data = await res.json();
        if (data.access_token) {
          token = data.access_token;
          localStorage.setItem('sp_token', token);
          window.history.replaceState({}, document.title, redirectUri);
        }
      }
      if (token) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
      }
    }

    window.onSpotifyWebPlaybackSDKReady = () => {
      if (!token) return;
      player = new Spotify.Player({
        name: 'Custom Web Player',
        getOAuthToken: cb => cb(token),
        volume: 0.8
      });
      player.addListener('ready', ({ device_id }) => { deviceId = device_id; });
      player.addListener('player_state_changed', state => {
        if (!state) return;
        const track = state.track_window.current_track;
        document.getElementById('track-info').innerText = `${track.name} — ${track.artists.map(a => a.name).join(', ')}`;
      });
      player.connect();
    };

    async function searchSongs() {
      const q = document.getElementById('search-input').value;
      const res = await fetch(`https://spotify.com{encodeURIComponent(q)}&type=track&limit=8`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const box = document.getElementById('results');
      box.innerHTML = '';
      data.tracks.items.forEach(t => {
        const div = document.createElement('div');
        div.className = 'track';
        div.innerHTML = `<span>${t.name} - ${t.artists[0].name}</span><button onclick="playUri('${t.uri}')">Play</button>`;
        box.appendChild(div);
      });
    }

    async function playUri(uri) {
      await fetch(`https://spotify.com{deviceId}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ uris: [uri] })
      });
    }

    handleAuth();
  </script>
</body>
</html>
